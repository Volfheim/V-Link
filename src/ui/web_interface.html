<!DOCTYPE html>
<html lang="{{HTML_LANG}}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>V-Link Mobile</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            /* More transparent surface */
            --primary: #8b5cf6;
            /* Violet */
            --primary-dark: #7c3aed;
            --text: #f8fafc;
            --text-secondary: #cbd5e1;
            --border: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
            --success: #22c55e;
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #170F30 0%, #0B1020 100%);
            background-attachment: fixed;
            color: var(--text);
            padding-bottom: 30px;
            /* Safe area for bottom bar */
            min-height: 100vh;
        }

        /* --- Header --- */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            font-weight: 700;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand svg {
            width: 24px;
            height: 24px;
            color: var(--primary);
        }

        .status-badge {
            font-size: 12px;
            padding: 4px 10px;
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border-radius: 99px;
            border: 1px solid rgba(34, 197, 94, 0.3);
            font-weight: 600;
        }

        /* --- Container --- */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* --- Upload Zone --- */
        .upload-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            border: 2px dashed rgba(99, 102, 241, 0.3);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .upload-card:active {
            transform: scale(0.98);
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            background: rgba(99, 102, 241, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: var(--primary);
        }

        .upload-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .upload-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            color: white;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: background 0.2s;
        }

        .btn:active {
            background: var(--primary-dark);
        }

        .btn svg {
            margin-right: 8px;
        }

        #fileInput, #dirInput {
            display: none;
        }

        /* --- Files List --- */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
        }

        .refresh-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .refresh-btn:active {
            background: rgba(99, 102, 241, 0.1);
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .file-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            transition: transform 0.1s;
        }

        .file-card:active {
            transform: scale(0.98);
            background: #263345;
        }

        .file-icon {
            width: 48px;
            height: 48px;
            background: #273548;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .file-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .download-icon {
            color: var(--primary);
            padding: 8px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 50%;
        }

        /* --- Toast & Progress --- */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            pointer-events: none;
        }

        .toast {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast.error {
            border-left: 4px solid var(--danger);
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Progress Bar */
        .progress-bar-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: transparent;
            z-index: 200;
        }

        .progress-bar {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.2s;
            box-shadow: 0 0 10px var(--success);
        }

        .upload-detail {
            margin-top: 16px;
            padding: 14px;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid var(--border);
            text-align: left;
        }

        .upload-detail.hidden {
            display: none;
        }

        .upload-detail-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .upload-detail-meta,
        .upload-detail-bytes {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.45;
        }

        /* Utilities */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="brand">
            <!-- Logo Icon -->
            <img src="data:image/png;base64,{{LOGO_BASE64}}" style="width: 32px; height: 32px; object-fit: contain;" alt="V-Link">
            V-Link
        </div>
        <div class="status-badge" id="statusBadge">Online</div>
    </header>

    <div class="container">

        <!-- Upload Card -->
        <div class="upload-card">
            <div class="upload-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
            </div>
            <div class="upload-title" id="uploadTitle">Upload files</div>
            <div class="upload-desc" id="uploadDesc">Tap to choose files</div>
            <div style="display: flex; gap: 10px; margin-top: 16px;">
                <button class="btn" id="chooseFilesBtn" style="flex: 1; font-size: 14px; padding: 12px 10px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                        <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>
                    <span id="chooseFilesText">Files</span>
                </button>
                <button class="btn" id="chooseFolderBtn" style="flex: 1; background: #0ea5e9; font-size: 14px; padding: 12px 10px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span id="chooseFolderText">Folder</span>
                </button>
            </div>
            <input type="file" id="fileInput" multiple>
            <input type="file" id="dirInput" webkitdirectory directory multiple>
            <div class="upload-detail hidden" id="uploadDetail">
                <div class="upload-detail-title" id="uploadDetailTitle">Uploading...</div>
                <div class="upload-detail-meta" id="uploadDetailMeta"></div>
                <div class="upload-detail-bytes" id="uploadDetailBytes"></div>
            </div>
        </div>

        <!-- Files List -->
        <div>
            <div class="section-header">
                <div class="section-title" id="filesOnPcTitle">Files on PC</div>
                <button class="refresh-btn" id="refreshBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                </button>
            </div>
            <div id="fileList" class="file-list">
                <!-- JS will populate this -->
                <div class="empty-state" id="listLoadingText">Loading list...</div>
            </div>
        </div>

    </div>

    <!-- Progress Bar -->
    <div class="progress-bar-wrap">
        <div id="progressBar" class="progress-bar"></div>
    </div>

    <!-- Toasts -->
    <div id="toastContainer" class="toast-container"></div>

    <script>
        // --- Core ---
        const I18N = {{I18N_JSON}};
        const tr = (key, fallback = '') => I18N[key] || fallback || key;
        const params = new URLSearchParams(window.location.search);
        const TOKEN = params.get("token") || "";

        const dom = {
            fileInput: document.getElementById('fileInput'),
            dirInput: document.getElementById('dirInput'),
            chooseFilesBtn: document.getElementById('chooseFilesBtn'),
            chooseFolderBtn: document.getElementById('chooseFolderBtn'),
            fileList: document.getElementById('fileList'),
            refreshBtn: document.getElementById('refreshBtn'),
            progressBar: document.getElementById('progressBar'),
            uploadDetail: document.getElementById('uploadDetail'),
            uploadDetailTitle: document.getElementById('uploadDetailTitle'),
            uploadDetailMeta: document.getElementById('uploadDetailMeta'),
            uploadDetailBytes: document.getElementById('uploadDetailBytes'),
            toastContainer: document.getElementById('toastContainer')
        };

        // Localize static labels
        document.getElementById('statusBadge').textContent = tr('online', 'Online');
        document.getElementById('uploadTitle').textContent = tr('uploadTitle', 'Upload files');
        document.getElementById('uploadDesc').textContent = tr('uploadDesc', 'Tap to choose files');
        document.getElementById('chooseFilesText').textContent = tr('chooseFiles', 'Files');
        if (document.getElementById('chooseFolderText')) document.getElementById('chooseFolderText').textContent = tr('chooseFolder', 'Folder');
        document.getElementById('filesOnPcTitle').textContent = tr('filesOnPc', 'Files on PC');
        document.getElementById('listLoadingText').textContent = tr('loadingList', 'Loading list...');

        // --- Utils ---
        function humanSize(bytes) {
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let size = bytes;
            let i = 0;
            while (size >= 1024 && i < units.length - 1) {
                size /= 1024;
                i++;
            }
            return `${size.toFixed(1)} ${units[i]}`;
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            dom.toastContainer.appendChild(toast);

            // Remove after 3s
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            // Default File Icon
            let path = '<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline>';

            if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
                // Image Icon
                path = '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline>';
            } else if (['mp4', 'mov', 'avi', 'mkv'].includes(ext)) {
                // Video Icon
                path = '<rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line>';
            } else if (['mp3', 'wav', 'ogg'].includes(ext)) {
                // Music Icon
                path = '<path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle>';
            }

            return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
        }

        // --- API ---
        async function fetchFiles() {
            if (!TOKEN) return;
            try {
                const res = await fetch(`/api/mobile/files?token=${encodeURIComponent(TOKEN)}`);
                const data = await res.json();
                if (data.status === 'ok') {
                    renderFiles(data.files);
                }
            } catch (e) {
                console.error("Fetch error", e);
            }
        }

        function renderFiles(files) {
            if (!files || files.length === 0) {
                dom.fileList.innerHTML = `<div class="empty-state">${tr('emptyFolder', 'Downloads folder is empty')}</div>`;
                return;
            }

            dom.fileList.innerHTML = files.map(f => {
                const safeName = escapeHtml(f.name);
                const href = `/api/mobile/download/${encodeURIComponent(f.name)}?token=${encodeURIComponent(TOKEN)}`;
                return `
                <a href="${href}" class="file-card" download>
                    <div class="file-icon">
                        ${getFileIcon(f.name)}
                    </div>
                    <div class="file-info">
                        <div class="file-name" title="${safeName}">${safeName}</div>
                        <div class="file-meta">${humanSize(f.size)} • ${new Date(f.mtime * 1000).toLocaleDateString()}</div>
                    </div>
                    <div class="download-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </div>
                </a>
            `}).join('');
        }

        async function uploadFiles(e) {
            const files = Array.from(e.target.files || []);
            if (!files.length) return;

            const totalBytes = files.reduce((sum, file) => sum + (file.size || 0), 0);
            const firstRel = files[0].webkitRelativePath || files[0].name || '';
            const rootName = firstRel.includes('/') ? firstRel.split('/')[0] : '';
            const uploadName = rootName || (files.length === 1 ? files[0].name : 'mobile-upload');

            const formData = new FormData();
            for (const file of files) {
                const relPath = file.webkitRelativePath || file.name;
                formData.append('file', file, relPath);
            }

            const xhr = new XMLHttpRequest();
            xhr.open('POST', `/api/mobile/upload?token=${encodeURIComponent(TOKEN)}`, true);
            xhr.setRequestHeader('X-Upload-Total-Size', String(totalBytes));
            xhr.setRequestHeader('X-Upload-File-Count', String(files.length));
            xhr.setRequestHeader('X-Upload-Name', encodeURIComponent(uploadName));

            dom.uploadDetail.classList.remove('hidden');
            dom.uploadDetailTitle.textContent = tr('uploading', 'Uploading...');
            dom.uploadDetailMeta.textContent = rootName
                ? `${tr('selectedFolder', 'Folder: {name}').replace('{name}', rootName)} • ${tr('selectedFiles', 'Files: {count}').replace('{count}', files.length)}`
                : tr('selectedFiles', 'Files: {count}').replace('{count}', files.length);
            dom.uploadDetailBytes.textContent = tr('uploadBytes', '{sent} of {total}')
                .replace('{sent}', humanSize(0))
                .replace('{total}', humanSize(totalBytes));

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percent = (e.loaded / e.total) * 100;
                    dom.progressBar.style.width = percent + '%';
                    const sent = totalBytes > 0 ? Math.min(totalBytes, e.loaded) : e.loaded;
                    dom.uploadDetailBytes.textContent = tr('uploadBytes', '{sent} of {total}')
                        .replace('{sent}', humanSize(sent))
                        .replace('{total}', humanSize(totalBytes || e.total));
                }
            };

            xhr.onload = () => {
                dom.progressBar.style.width = '0%';
                if (xhr.status === 200) {
                    dom.uploadDetailTitle.textContent = tr('uploadComplete', 'Done');
                    dom.uploadDetailBytes.textContent = tr('uploadBytes', '{sent} of {total}')
                        .replace('{sent}', humanSize(totalBytes))
                        .replace('{total}', humanSize(totalBytes));
                    showToast(tr('uploadSuccess', 'Files uploaded successfully'), 'success');
                    fetchFiles();
                } else {
                    showToast(tr('uploadError', 'Upload error'), 'error');
                    dom.uploadDetail.classList.add('hidden');
                }
                dom.fileInput.value = '';
                if (dom.dirInput) dom.dirInput.value = '';
            };

            xhr.onerror = () => {
                showToast(tr('networkError', 'Network error'), 'error');
                dom.progressBar.style.width = '0%';
                dom.uploadDetail.classList.add('hidden');
            };

            xhr.send(formData);
        }

        // --- Init ---
        if (!TOKEN) {
            document.body.innerHTML = `
                <div class="container" style="text-align:center; padding-top:100px;">
                    <h2>${tr('accessErrorTitle', 'Access error')}</h2>
                    <p>${tr('accessErrorText', 'Scan QR code again in V-Link app.')}</p>
                </div>
            `;
        } else {
            if (dom.chooseFilesBtn) dom.chooseFilesBtn.addEventListener('click', () => dom.fileInput.click());
            if (dom.chooseFolderBtn) dom.chooseFolderBtn.addEventListener('click', () => dom.dirInput.click());
            dom.fileInput.addEventListener('change', uploadFiles);
            if (dom.dirInput) dom.dirInput.addEventListener('change', uploadFiles);
            
            dom.refreshBtn.addEventListener('click', () => {
                dom.refreshBtn.style.transform = 'rotate(360deg)';
                setTimeout(() => dom.refreshBtn.style.transform = 'none', 500);
                fetchFiles();
            });

            // Initial load
            fetchFiles();

            // Auto-refresh every 5s
            setInterval(fetchFiles, 5000);
        }
    </script>
</body>

</html>
